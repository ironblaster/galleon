name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck galleon tests/*.sh
      - name: ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: core
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: core/Dockerfile
      - name: presets contain no credentials
        run: |
          if grep -RInE '^\s*(password|passkey|apikey|api_key|cookie|token|rsskey)\s*:\s*[^$[:space:]#]' presets/; then
            echo "::error::literal secret in a preset: use \${GALLEON_IDX_*} placeholders"
            exit 1
          fi
      - name: compose files are valid
        run: |
          GALLEON_YES=1 ./galleon init --yes
          docker compose -f compose.yaml -f compose.vpn.yaml -f compose.gpu.yaml --profile trash config -q

  voyage:
    name: voyage test (full stack)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: init
        run: |
          GALLEON_YES=1 ./galleon init --yes
          sed -i 's/^GALLEON_INDEXER_PRESETS=.*/GALLEON_INDEXER_PRESETS=public-anime/' .env
      - name: up (first voyage)
        run: ./galleon up
      - name: assert wiring
        run: tests/e2e.sh
      - name: second bootstrap is idempotent
        run: ./galleon bootstrap && tests/e2e.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 200

  image:
    name: publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: voyage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # keyless cosign signature (OIDC)
      attestations: write   # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/galleon
          tags: |
            type=raw,value=latest
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: core
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: cosign sign --yes "ghcr.io/${OWNER}/galleon@${DIGEST}"
