# Recyclarr v8: TRaSH Guides quality profiles, kept in sync daily.
# Enabled with GALLEON_TRASH=true. Find more profiles with:
#   docker run --rm ghcr.io/recyclarr/recyclarr:8 list quality-profiles radarr
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
