# Routes qBittorrent through Gluetun. Enabled with GALLEON_VPN=true (./galleon handles it).
# Provider settings: https://github.com/qdm12/gluetun-wiki
services:
  gluetun:
    image: qmcgaw/gluetun:1243
    container_name: gluetun
    restart: unless-stopped
    networks: [fleet]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      TZ: ${TZ:-Etc/UTC}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      FIREWALL_INPUT_PORTS: "8080"
      FIREWALL_VPN_INPUT_PORTS: ${VPN_FORWARDED_PORT:-}
    ports:
      - ${GALLEON_PORT_QBITTORRENT:-8080}:8080

  qbittorrent:
    network_mode: service:gluetun
    networks: !reset []
    ports: !reset []
    depends_on:
      gluetun: { condition: service_healthy }

  galleon:
    environment:
      GALLEON_QBIT_HOST: gluetun
